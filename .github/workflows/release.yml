name: Build & Release

# Every push and pull request is checked, built (app + installer) and the
# installer is tested on a clean machine. Pushing a tag like v1.2.0 also
# publishes a GitHub release with the installer, the portable exe and that
# version's CHANGELOG notes.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5

      # Pinned so CI lints match local builds; bump deliberately.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.89.0"
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Read version
        id: ver
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches.Groups[1].Value
          $num = ($v -split '[-+]')[0] + '.0'
          "version=$v" >> $env:GITHUB_OUTPUT
          "number=$num" >> $env:GITHUB_OUTPUT
          Write-Host "Version $v ($num)"

      - name: Tag must match Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          if ($tag -ne "${{ steps.ver.outputs.version }}") {
            Write-Error "Tag v$tag does not match Cargo.toml version ${{ steps.ver.outputs.version }}"
            exit 1
          }

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --release --locked -- -D warnings

      - name: Build
        run: cargo build --release --locked

      # Pinned Inno Setup version in a private folder, so every build uses
      # exactly the same installer compiler.
      - name: Install Inno Setup 6.7.4
        run: |
          $url = "https://github.com/jrsoftware/issrc/releases/download/is-6_7_4/innosetup-6.7.4.exe"
          Invoke-WebRequest $url -OutFile "$env:RUNNER_TEMP\innosetup.exe"
          $dir = "$env:RUNNER_TEMP\inno"
          Start-Process "$env:RUNNER_TEMP\innosetup.exe" -Wait -ArgumentList `
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/CURRENTUSER', "/DIR=$dir"
          if (-not (Test-Path "$dir\ISCC.exe")) { throw "Inno Setup did not install" }
          "ISCC=$dir\ISCC.exe" >> $env:GITHUB_ENV

      - name: Build installer
        run: |
          & $env:ISCC /Q `
            "/DAppVersion=${{ steps.ver.outputs.version }}" `
            "/DAppVersionNum=${{ steps.ver.outputs.number }}" `
            installer\music-notch.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Collect downloads
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $v = "${{ steps.ver.outputs.version }}"
          Copy-Item "target\installer\Music-Notch-Setup-$v.exe" dist\
          Copy-Item target\release\music-notch.exe "dist\Music-Notch-$v-portable.exe"
          Get-ChildItem dist | ForEach-Object { "{0}  {1:N0} KB" -f $_.Name, ($_.Length / 1KB) }

      # Install, check, uninstall, check - on a clean machine, every build.
      - name: Test installer
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $dir = "$env:LOCALAPPDATA\Programs\Music Notch"
          $exe = "$dir\music-notch.exe"
          $lnk = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Music Notch.lnk"
          $run = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run"
          $uninst = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{8F3C2A71-5B4D-4E9A-9C1F-6D2E7A0B3C45}_is1"

          Start-Process "dist\Music-Notch-Setup-$v.exe" -Wait -ArgumentList `
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/TASKS=startup'
          if (-not (Test-Path $exe)) { throw "App was not installed" }
          if (-not (Test-Path $lnk)) { throw "Start menu shortcut missing" }
          if ((Get-ItemProperty $uninst).DisplayVersion -ne $v) { throw "Apps & features entry missing or wrong version" }
          if ((Get-ItemProperty $run).MusicNotch -ne "`"$exe`"") { throw "Startup entry missing" }
          if ((Get-Item $exe).VersionInfo.ProductVersion -ne $v) { throw "Installed exe has the wrong version" }
          Write-Host "Install OK"

          Start-Process "$dir\unins000.exe" -Wait -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          for ($i = 0; $i -lt 30 -and (Test-Path $exe); $i++) { Start-Sleep 1 }
          if (Test-Path $exe) { throw "Uninstall left the app behind" }
          if (Test-Path $lnk) { throw "Uninstall left the shortcut behind" }
          if ((Get-ItemProperty $run -ErrorAction SilentlyContinue).MusicNotch) { throw "Uninstall left the startup entry behind" }
          Write-Host "Uninstall OK"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: music-notch-${{ steps.ver.outputs.version }}
          path: dist/*

      - name: Release notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $v = [regex]::Escape("${{ steps.ver.outputs.version }}")
          $text = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($text, "(?ms)^## \[$v\][^\n]*\n(.*?)(?=^## \[|\z)")
          $notes = if ($m.Success) { $m.Groups[1].Value.Trim() } else { "See CHANGELOG.md." }
          $notes += "`n`n---`n**Install:** download **Music-Notch-Setup-${{ steps.ver.outputs.version }}.exe** and run it. "
          $notes += "Prefer no installer? Use the portable exe instead."
          Set-Content notes.md $notes -Encoding utf8

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Music Notch ${{ github.ref_name }}
          body_path: notes.md
          files: dist/*
          prerelease: ${{ contains(github.ref_name, '-') }}
